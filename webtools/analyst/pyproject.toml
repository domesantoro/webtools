[project]
name = "webtools_analyst"
version = "0.1.0"
description = "An internal subsystem: it turns a finished pre-analysis into the analysis and the list of functional points."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    # The documents this subsystem writes are rendered from the models the
    # configurator distributes (`documents/*.md.j2`). Jinja2 and not nunjucks because
    # this subsystem is Python: nunjucks is a JavaScript library, and the
    # pre-specification's model next door is rendered by the preanalyst, which is Node.
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
