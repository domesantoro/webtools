[project]
name = "anagraphics"
version = "0.1.0"
description = "An internal subsystem: the subsystems' configurations and the projects' records."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymongo>=4.8",
    # The metrics client sends with it. It was already here as a dev dependency,
    # for the test client; it is a real one now.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
