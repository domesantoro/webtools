[project]
name = "anagraphics"
version = "0.1.0"
description = "Sottosistema interno: configurazioni dei sottosistemi e anagrafica dei progetti (sola lettura)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymongo>=4.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
