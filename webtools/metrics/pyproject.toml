[project]
name = "webtools_metrics"
version = "0.1.0"
description = "An internal subsystem: the system's technical and commercial metrics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymongo>=4.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
